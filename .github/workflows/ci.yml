name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m realworldbuilder scan tests/fixtures/sample_repo --output /tmp/rwb_verify
      - run: python -m realworldbuilder compare --before /tmp/rwb_verify --after /tmp/rwb_verify
